<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Sequence Samples — Hari Scales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #131313;
    --onyx: #3C3C3C;
    --dim-gray: #646464;
    --silver: #B5B5B5;
    --white-smoke: #F3F3F3;
    --white: #ffffff;
    --border: #2a2a2a;
    --muted: #a0a0a0;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: radial-gradient(circle at 15% 50%, rgba(60, 60, 60, 0.4), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(40, 40, 40, 0.4), transparent 50%);
    background-color: var(--night);
    color: var(--white-smoke);
    font-family: 'Space Grotesk', sans-serif;
    overflow-x: hidden;
    padding-top: 80px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; width: 100%; height: 80px;
    background: rgba(19, 19, 19, 0.95); backdrop-filter: blur(8px);
    z-index: 900; border-bottom: 1px solid var(--onyx);
    display: flex; align-items: center; justify-content: center;
  }
  .nav-container {
    width: 100%; max-width: 1280px; padding: 0 40px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-logo { font-family: 'Syne', sans-serif; font-size: 26px; color: var(--white); text-decoration: none; letter-spacing: 1px; }
  
  .back-btn {
    display: inline-flex; align-items: center; color: var(--white-smoke); text-decoration: none;
    font-size: 14px; text-transform: uppercase; letter-spacing: 1px; transition: opacity 0.3s;
  }
  .back-btn:hover { opacity: 0.7; }
  .back-btn span { margin-right: 8px; font-size: 18px; line-height: 1; }

  /* HEADER */
  .page-header { text-align: center; margin: 80px 0 60px; padding: 0 20px; }
  .page-header h1 { 
    font-family: 'Syne', sans-serif; 
    font-size: 56px; 
    font-weight: 600; 
    margin-bottom: 16px; 
    background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .page-meta { color: var(--muted); font-size: 16px; letter-spacing: 1px; text-transform: uppercase; }

  /* GRID */
  .portfolio-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 30px;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    padding: 0 20px 40px;
    flex: 1;
  }

  .sample-card {
    background: rgba(20, 20, 20, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    border-radius: 16px;
    padding: 60px 30px;
    text-align: center;
    cursor: pointer;
    transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .sample-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.06), transparent);
    transform: translateX(-100%);
    transition: transform 0.6s ease;
  }

  .sample-card:hover {
    transform: translateY(-8px);
    border-color: rgba(255, 255, 255, 0.25);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 255, 255, 0.05);
  }

  .sample-card:hover::before {
    transform: translateX(100%);
  }

  .card-icon {
    width: 48px;
    height: 48px;
    margin-bottom: 24px;
    fill: none;
    stroke: rgba(255, 255, 255, 0.6);
    stroke-width: 1.5;
    transition: all 0.4s ease;
  }

  .sample-card:hover .card-icon {
    transform: scale(1.1);
    stroke: #ffffff;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
  }

  .sample-card h3 {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 600;
    color: var(--white);
    margin-bottom: 12px;
  }

  .sample-card p {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  .view-btn {
    display: inline-block;
    margin-top: 36px;
    padding: 14px 32px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 30px;
    color: var(--white-smoke);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    transition: all 0.4s ease;
    background: rgba(255, 255, 255, 0.03);
  }

  .sample-card:hover .view-btn {
    background: var(--white);
    color: var(--night);
    border-color: var(--white);
    box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
  }

  /* FULLSCREEN MODAL */
  .fullscreen-modal {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: var(--night);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .fullscreen-modal.active {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-header {
    height: 70px;
    background: #0a0a0a;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 30px;
  }

  .modal-title {
    font-family: 'Space Grotesk', sans-serif;
    color: var(--white);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .close-btn {
    background: none;
    border: none;
    color: var(--silver);
    font-size: 32px;
    line-height: 1;
    cursor: pointer;
    transition: color 0.3s;
    padding: 0;
    display: flex;
    align-items: center;
  }

  .close-btn:hover {
    color: var(--white);
  }

  .iframe-container {
    flex: 1;
    width: 100%;
    background: #f6f6f6;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .iframe-container iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* CTA */
  .ep-cta-container { text-align: center; margin-bottom: 60px; }
  .ig-btn {
    display: inline-block; padding: 18px 40px; background: var(--white-smoke); color: var(--night);
    text-transform: uppercase; font-size: 13px; font-weight: 600; letter-spacing: 2px;
    text-decoration: none; border-radius: 2px; transition: transform 0.3s, background 0.3s;
  }
  .ig-btn:hover { background: var(--white); transform: translateY(-2px); }

  @media(max-width: 768px) {
    .page-header h1 { font-size: 36px; }
    .nav-container { padding: 0 20px; }
    .portfolio-grid { grid-template-columns: 1fr; padding: 0 20px 40px; }
    .modal-header { padding: 0 20px; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-container">
    <a href="index.html" class="nav-logo">HS</a>
    <a href="index.html" class="back-btn"><span>←</span> Back to Portfolio</a>
  </div>
</nav>

<div class="page-header">
  <h1>Email Sequence Portfolio</h1>
  <p class="page-meta">High-Converting Campaigns & Automated Sequences</p>
</div>

<div class="portfolio-grid">
  <!-- Oura Sample -->
  <div class="sample-card" onclick="openFullscreen('GRAVITY_OURA/index.html', 'Oura Ring Campaign')">
    <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
      <polyline points="22,6 12,13 2,6"></polyline>
    </svg>
    <h3>Oura Ring</h3>
    <p>Promotional Campaign</p>
    <div class="view-btn">View Full Email</div>
  </div>
  
  <!-- Chubbies Sample -->
  <div class="sample-card" onclick="openFullscreen('Chubbies/index.html', 'Chubbies Campaign')">
    <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
      <polyline points="22,6 12,13 2,6"></polyline>
    </svg>
    <h3>Chubbies</h3>
    <p>Sales Sequence</p>
    <div class="view-btn">View Full Email</div>
  </div>
  
  <!-- Ninja Kitchen Sample -->
  <div class="sample-card" onclick="openFullscreen('NINJA KITCEN/index.html', 'Ninja Kitchen Campaign')">
    <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
      <polyline points="22,6 12,13 2,6"></polyline>
    </svg>
    <h3>Ninja Kitchen</h3>
    <p>Product Launch</p>
    <div class="view-btn">View Full Email</div>
  </div>
</div>

<div class="ep-cta-container">
  <a href="index.html#contact" class="ig-btn">Book Discovery Call</a>
</div>

<!-- FULLSCREEN VIEWER -->
<div id="fullscreen-modal" class="fullscreen-modal">
  <div class="modal-header">
    <div class="modal-title" id="modal-title">Email Sample</div>
    <button class="close-btn" onclick="closeFullscreen()">×</button>
  </div>
  <div class="iframe-container">
    <iframe id="fullscreen-iframe" src="" title="Email Sample Viewer"></iframe>
  </div>
</div>

<script>
function openFullscreen(url, title) {
  document.getElementById('modal-title').innerText = title;
  document.getElementById('fullscreen-iframe').src = url;
  document.getElementById('fullscreen-modal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeFullscreen() {
  document.getElementById('fullscreen-modal').classList.remove('active');
  document.body.style.overflow = '';
  // slight delay to clear src so it doesn't flash white before fading out
  setTimeout(() => {
    document.getElementById('fullscreen-iframe').src = '';
  }, 300);
}

// Close on escape key
document.addEventListener('keydown', function(event) {
  if (event.key === "Escape") {
    closeFullscreen();
  }
});
</script>
</body>
</html>
